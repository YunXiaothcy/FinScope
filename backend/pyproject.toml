[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finscope-backend"
version = "0.1.0"
description = "FinScope API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "pillow>=12,<14",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ocr" = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# FastAPI dependency declarations intentionally use Depends(...) defaults.
ignore = ["B008"]
